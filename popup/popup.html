<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DesireMovies Bypass</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      width: 320px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    h1 {
      font-size: 16px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    .settings-btn:hover {
      background: var(--border);
    }
    .logs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 300px;
      overflow-y: auto;
    }
    .log-item {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
    }
    .log-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .log-time {
      color: var(--text-muted);
      font-weight: normal;
      font-size: 10px;
    }
    .status-success { color: var(--success); }
    .status-error { color: var(--error); }
    .status-info { color: var(--primary); }
    .status-warning { color: var(--warning); }
    
    .log-msg {
      color: var(--text-muted);
      word-break: break-all;
    }
    .empty {
      text-align: center;
      color: var(--text-muted);
      padding: 20px 0;
      font-size: 13px;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎬 Bypass Status</h1>
    <button id="settingsBtn" class="settings-btn">⚙️ Settings</button>
  </div>
  <div class="logs" id="logsContainer">
    <div class="empty">Loading...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
